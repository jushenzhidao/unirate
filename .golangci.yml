version: "2"

run:
  tests: true

linters:
  # v2 默认已启用 errcheck / govet / ineffassign / staticcheck / unused，
  # 无需重复声明；v1 时代的 gosimple 已并入 staticcheck。
  enable:
    - bodyclose      # HTTP 响应体未关闭 = 连接泄漏，网关场景必查
    - noctx          # 缺少 context 的外部调用无法超时控制
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - errorlint
    - misspell
    - unconvert
    - copyloopvar

  settings:
    errcheck:
      # 这些场景的错误确实可忽略：响应已发出后的写入失败无从处理
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*strings.Builder).WriteString
        - (*strings.Builder).Write
        - (*strings.Builder).WriteByte
    govet:
      # 刻意不启用 shadow：它会把 Go 官方推荐的
      #   if err := f(); err != nil { ... }
      # 判定为 "declaration of err shadows declaration at ..."。
      # 这类告警在本仓库集中出现在错误处理惯用写法上，不是真实缺陷；
      # 为消警而改成复用外层 err，反而扩大变量作用域、增加误用风险。
      disable:
        - shadow
    staticcheck:
      # 全量开启，但排除 QF1001（De Morgan 定律重写）。
      # 该建议会把字符集判定
      #   if !(c >= 'a' && c <= 'z' || c >= '0' && c <= '9' || c == '-')
      # 改写成一串取反的比较，语义等价但可读性明显下降：
      # 原式直接表达「不属于合法字符集」，改写后需读者自行还原集合含义。
      checks:
        - all
        - "-QF1001"

  exclusions:
    generated: lax
    # 仅保留必要预设：comments 处理文档注释噪声，
    # std-error-handling 免除标准库既定的错误忽略惯例。
    # 刻意不引入 legacy 与 common-false-positives——它们会整体放宽
    # 检查范围，与本仓库「宁可多查」的取向相反。
    presets:
      - comments
      - std-error-handling
    rules:
      # 测试代码允许更宽松的错误处理
      - path: _test\.go
        linters: [errcheck, bodyclose, noctx]
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
