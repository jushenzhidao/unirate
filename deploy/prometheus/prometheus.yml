global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels:
    service: unirate

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: unirate-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9091"]
        labels:
          component: gateway

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
