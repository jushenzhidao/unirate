<?xml version="1.0" encoding="UTF-8"?>
<!--
  unirate 控制台 图标 sprite（唯一图标来源，共 50 个）
  ============================================================================
  落地方式（零构建 / 零外链）：
    把下面 <svg id="ico-sprite"> 整段原样粘进 index.html 的 <body> 首行。
    它自带 style="display:none"，不占布局、不产生 CLS。
    使用：<svg class="icon" aria-hidden="true"><use href="#i-refresh"/></svg>
    带语义时用 <svg class="icon" role="img" aria-label="重新加载"><use href="#i-refresh"/></svg>

  统一规范（不可单个覆盖）：
    viewBox      0 0 24 24
    stroke       currentColor（颜色一律由父元素 color 继承，不写死）
    stroke-width 1.5（唯一值；16px 与 24px 共用，视觉重量一致）
    linecap/join round
    fill         none（.dot / .grip 类点状图标用 currentColor 描点，见下方注释）
    尺寸         16 / 20 / 24 三档，由 .icon / .icon--md / .icon--lg 控制

  命名前缀：
    i-nav-*     侧栏导航（4 个模块）
    i-status-*  运行状态（与 design-tokens.json semantic.statusMapping 一一对应）
    其余为通用动作 / 领域概念图标
============================================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" id="ico-sprite" style="display:none" aria-hidden="true" focusable="false">
  <defs>
    <!-- 全 sprite 共享的描边默认值，单个 symbol 不再重复声明 -->
    <style>
      #ico-sprite symbol,
      svg.icon {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* 点状元素（cpu 引脚、grip 手柄、感叹号点）用较粗描边模拟实心点 */
      #ico-sprite .dot { stroke-width: 2; }
    </style>
  </defs>

  <!-- ==== 侧栏导航：4 个模块 ================================================= -->

  <!-- 实时监控看板：仪表盘（指针 + 半圆刻度弧） -->
  <symbol id="i-nav-monitor" viewBox="0 0 24 24">
    <path d="M4 18a8 8 0 1 1 16 0"/>
    <path d="M12 18l4.2-4.7"/>
    <path d="M12 18h.01" class="dot"/>
    <path d="M4 18h2.2M19.8 18H22"/>
  </symbol>

  <!-- 业务域与限流规则：滑杆（阈值可调的语义） -->
  <symbol id="i-nav-rules" viewBox="0 0 24 24">
    <path d="M3 8h9.8M17.2 8H21"/>
    <circle cx="15" cy="8" r="2.2"/>
    <path d="M3 16h3.8M11.2 16H21"/>
    <circle cx="9" cy="16" r="2.2"/>
  </symbol>

  <!-- 审计日志：带条目的文档 -->
  <symbol id="i-nav-audit" viewBox="0 0 24 24">
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
    <path d="M14 3v5h5"/>
    <path d="M9 13h6M9 17h4"/>
  </symbol>

  <!-- 配置快照与热更新：层叠（版本层的语义） -->
  <symbol id="i-nav-config" viewBox="0 0 24 24">
    <path d="M12 3 3 8l9 5 9-5-9-5z"/>
    <path d="M3 12l9 5 9-5"/>
    <path d="M3 16.5l9 5 9-5"/>
  </symbol>

  <!-- ==== 运行状态：五态，形状各不相同（不依赖颜色即可区分） ================ -->

  <!-- 正常 · 圆形 -->
  <symbol id="i-status-ok" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8 12.4l2.9 2.9L16.6 9.6"/>
  </symbol>

  <!-- 接近上限 · 三角形 -->
  <symbol id="i-status-warn" viewBox="0 0 24 24">
    <path d="M11.1 4.6 2.4 19.4A1 1 0 0 0 3.3 21h17.4a1 1 0 0 0 .9-1.6L12.9 4.6a1 1 0 0 0-1.8 0z"/>
    <path d="M12 10v4"/>
    <path d="M12 17.3h.01" class="dot"/>
  </symbol>

  <!-- 降级（Redis 不可达，本地兜底放行）· 菱形 -->
  <symbol id="i-status-degraded" viewBox="0 0 24 24">
    <path d="M12 2.8 21.2 12 12 21.2 2.8 12z"/>
    <path d="M12 8.4v4.2"/>
    <path d="M12 15.9h.01" class="dot"/>
  </symbol>

  <!-- 故障 · 圆形 + 叉（与 ok 同形不同符，故障态另有红色 + 文案兜底） -->
  <symbol id="i-status-fail" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M15 9l-6 6M9 9l6 6"/>
  </symbol>

  <!-- 已停用 · 圆形 + 斜杠 -->
  <symbol id="i-status-off" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M5.6 18.4 18.4 5.6"/>
  </symbol>

  <!-- ==== 领域概念 ========================================================== -->

  <!-- 业务域 biz：立方体 -->
  <symbol id="i-biz" viewBox="0 0 24 24">
    <path d="M20.5 7.6 12 3 3.5 7.6v8.8L12 21l8.5-4.6z"/>
    <path d="M3.5 7.6 12 12.2l8.5-4.6"/>
    <path d="M12 12.2V21"/>
  </symbol>

  <!-- 速率规则 rate：脉冲曲线 -->
  <symbol id="i-rule-rate" viewBox="0 0 24 24">
    <path d="M3 12h3.6l2.6-7 4 14 2.4-7H21"/>
  </symbol>

  <!-- 并发规则 concurrency：两条并行流 -->
  <symbol id="i-rule-concurrency" viewBox="0 0 24 24">
    <path d="M3 8h13"/>
    <path d="M12.5 4.6 16 8l-3.5 3.4"/>
    <path d="M3 16h13"/>
    <path d="M12.5 12.6 16 16l-3.5 3.4"/>
  </symbol>

  <!-- Token 计量：芯片 -->
  <symbol id="i-token" viewBox="0 0 24 24">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="8.5" y="8.5" width="7" height="7" rx="1"/>
    <path d="M9.5 2.4v2.1M14.5 2.4v2.1M9.5 19.5v2.1M14.5 19.5v2.1M2.4 9.5h2.1M2.4 14.5h2.1M19.5 9.5h2.1M19.5 14.5h2.1"/>
  </symbol>

  <!-- 延迟 P99：秒表 -->
  <symbol id="i-latency" viewBox="0 0 24 24">
    <circle cx="12" cy="13.5" r="7.5"/>
    <path d="M12 10v3.8l2.6 2"/>
    <path d="M9.5 2.5h5"/>
  </symbol>

  <!-- 熔断器：闪电（open = 断开供给） -->
  <symbol id="i-breaker" viewBox="0 0 24 24">
    <path d="M13.2 2.5 4.6 13.6a.6.6 0 0 0 .5 1H10l-1 7 9.9-11.6a.6.6 0 0 0-.5-1H13.2z"/>
  </symbol>

  <!-- 网关节点：机架 -->
  <symbol id="i-server" viewBox="0 0 24 24">
    <rect x="3" y="4" width="18" height="7" rx="1.6"/>
    <rect x="3" y="13" width="18" height="7" rx="1.6"/>
    <path d="M7 7.5h.01M7 16.5h.01" class="dot"/>
  </symbol>

  <!-- 操作者：人像 -->
  <symbol id="i-user" viewBox="0 0 24 24">
    <circle cx="12" cy="8.4" r="3.9"/>
    <path d="M4.6 20.5a7.4 7.4 0 0 1 14.8 0"/>
  </symbol>

  <!-- 鉴权 / 安全边界：盾牌 -->
  <symbol id="i-shield" viewBox="0 0 24 24">
    <path d="M12 3 5 6v5.6c0 4.4 3 8.2 7 9.4 4-1.2 7-5 7-9.4V6z"/>
  </symbol>

  <!-- Bearer Token：钥匙（登录页） -->
  <symbol id="i-key" viewBox="0 0 24 24">
    <circle cx="8.4" cy="15.6" r="3.6"/>
    <path d="M11 13 20 4"/>
    <path d="M17.4 6.6 19.9 9.1"/>
    <path d="M14.6 9.4 17.1 11.9"/>
  </symbol>

  <!-- ==== 通用动作 ========================================================== -->

  <!-- 重新加载配置（热更新） -->
  <symbol id="i-refresh" viewBox="0 0 24 24">
    <path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/>
    <path d="M20.5 3.5v4.2h-4.2"/>
  </symbol>

  <!-- 加载中：270° 弧，配 CSS @keyframes spin 使用 -->
  <symbol id="i-spinner" viewBox="0 0 24 24">
    <path d="M12 3.5a8.5 8.5 0 1 0 8.5 8.5"/>
  </symbol>

  <!-- 新增 -->
  <symbol id="i-plus" viewBox="0 0 24 24">
    <path d="M12 5v14M5 12h14"/>
  </symbol>

  <!-- 编辑 -->
  <symbol id="i-edit" viewBox="0 0 24 24">
    <path d="M17.3 3.2a2.8 2.8 0 0 1 4 4L7.6 20.8 2.6 21.4l.6-5z"/>
    <path d="M15.3 5.2l4 4"/>
  </symbol>

  <!-- 删除 -->
  <symbol id="i-trash" viewBox="0 0 24 24">
    <path d="M4 7h16"/>
    <path d="M9.5 7V4.2h5V7"/>
    <path d="M6.2 7l.9 12.9a1.2 1.2 0 0 0 1.2 1.1h7.4a1.2 1.2 0 0 0 1.2-1.1L17.8 7"/>
    <path d="M10.5 11v6M13.5 11v6"/>
  </symbol>

  <!-- 复制（biz 名 / config version / trace id） -->
  <symbol id="i-copy" viewBox="0 0 24 24">
    <rect x="9" y="9" width="11" height="11" rx="2"/>
    <path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/>
  </symbol>

  <!-- 确认 / 校验通过 -->
  <symbol id="i-check" viewBox="0 0 24 24">
    <path d="M4.5 12.5l5 5L20 6.8"/>
  </symbol>

  <!-- 关闭 / 清除筛选 -->
  <symbol id="i-close" viewBox="0 0 24 24">
    <path d="M6 6l12 12M18 6L6 18"/>
  </symbol>

  <!-- 搜索 -->
  <symbol id="i-search" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3 21 21"/>
  </symbol>

  <!-- 筛选 -->
  <symbol id="i-filter" viewBox="0 0 24 24">
    <path d="M4 5h16l-6.4 7.6V20l-3.2-1.9v-5.5z"/>
  </symbol>

  <!-- 导出 CSV -->
  <symbol id="i-download" viewBox="0 0 24 24">
    <path d="M12 3.5v11"/>
    <path d="M7.6 10.2 12 14.6l4.4-4.4"/>
    <path d="M4.5 19.5h15"/>
  </symbol>

  <!-- 展开 / 收起 -->
  <symbol id="i-chevron-down" viewBox="0 0 24 24">
    <path d="M6 9.5l6 6 6-6"/>
  </symbol>
  <symbol id="i-chevron-up" viewBox="0 0 24 24">
    <path d="M6 14.5l6-6 6 6"/>
  </symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24">
    <path d="M9.5 6l6 6-6 6"/>
  </symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24">
    <path d="M14.5 6l-6 6 6 6"/>
  </symbol>

  <!-- 排序：升 / 降 -->
  <symbol id="i-sort-asc" viewBox="0 0 24 24">
    <path d="M12 19.5V5"/>
    <path d="M6.5 10.5 12 5l5.5 5.5"/>
  </symbol>
  <symbol id="i-sort-desc" viewBox="0 0 24 24">
    <path d="M12 4.5V19"/>
    <path d="M6.5 13.5 12 19l5.5-5.5"/>
  </symbol>

  <!-- 拖拽排序手柄（规则优先级） -->
  <symbol id="i-grip" viewBox="0 0 24 24">
    <path d="M9 6h.01M9 12h.01M9 18h.01M15 6h.01M15 12h.01M15 18h.01" class="dot"/>
  </symbol>

  <!-- 说明 / 字段帮助 -->
  <symbol id="i-info" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 11v5.6"/>
    <path d="M12 7.9h.01" class="dot"/>
  </symbol>

  <!-- 历史版本 / 快照时间线 -->
  <symbol id="i-history" viewBox="0 0 24 24">
    <path d="M3.5 12a8.5 8.5 0 1 0 3-6.5"/>
    <path d="M3.5 4v4h4"/>
    <path d="M12 8v4.4l3.2 1.9"/>
  </symbol>

  <!-- 时间戳 -->
  <symbol id="i-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 7.4V12l3.4 2.1"/>
  </symbol>

  <!-- 自动刷新：暂停 / 继续 -->
  <symbol id="i-pause" viewBox="0 0 24 24">
    <path d="M9.5 5.5v13M14.5 5.5v13"/>
  </symbol>
  <symbol id="i-play" viewBox="0 0 24 24">
    <path d="M8.5 5.6 19 12 8.5 18.4z"/>
  </symbol>

  <!-- 退出登录 -->
  <symbol id="i-logout" viewBox="0 0 24 24">
    <path d="M9.5 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.5"/>
    <path d="M16 8l4 4-4 4"/>
    <path d="M9.5 12H20"/>
  </symbol>

  <!-- 明暗主题切换 -->
  <symbol id="i-sun" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2.6v2.2M12 19.2v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>
  </symbol>
  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M20.8 13.4A9 9 0 1 1 10.6 3.2a7 7 0 0 0 10.2 10.2z"/>
  </symbol>

  <!-- 移动端侧栏开关 -->
  <symbol id="i-menu" viewBox="0 0 24 24">
    <path d="M4 7h16M4 12h16M4 17h16"/>
  </symbol>

  <!-- Token 明文显隐（登录页） -->
  <symbol id="i-eye" viewBox="0 0 24 24">
    <path d="M2.5 12S6.2 5.8 12 5.8 21.5 12 21.5 12 17.8 18.2 12 18.2 2.5 12 2.5 12z"/>
    <circle cx="12" cy="12" r="3"/>
  </symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24">
    <path d="M9.9 5.1A9.6 9.6 0 0 1 12 4.9c5.8 0 9.5 7.1 9.5 7.1a17 17 0 0 1-2.6 3.6"/>
    <path d="M6.3 6.9A17.4 17.4 0 0 0 2.5 12s3.7 7.1 9.5 7.1a9.3 9.3 0 0 0 4-.9"/>
    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
    <path d="M3.5 3.5l17 17"/>
  </symbol>

  <!-- 空状态：空收纳盒（仅 24px 使用） -->
  <symbol id="i-empty" viewBox="0 0 24 24">
    <path d="M3 8.6 6.1 4h11.8L21 8.6V19a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 19z"/>
    <path d="M3 8.6h5.6l1 3h4.8l1-3H21"/>
  </symbol>

  <!-- 外链（跳 Grafana / Prometheus 原始 metrics） -->
  <symbol id="i-external" viewBox="0 0 24 24">
    <path d="M14 4h6v6"/>
    <path d="M20 4l-8.5 8.5"/>
    <path d="M19 14.5V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h4.5"/>
  </symbol>
</svg>
