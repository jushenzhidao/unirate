name: CI

on:
  push:
    # 刻意不含 main：main 的推送由 release.yml 触发，
    # 它会通过 workflow_call 复用本文件作为发布前门禁。
    # 若这里也监听 main，每次推送会把 race 测试、e2e、
    # 多架构镜像整套跑两遍，且两条链的结论可能不一致。
    branches: [master, "release/**"]
  pull_request:
  workflow_dispatch:
  # 供 release.yml 复用，作为发布前的质量门禁
  workflow_call:
    inputs:
      # 由 release.yml 传入 true。为真时 build-image 只验证镜像能否构建，
      # 不登录也不推送 —— 对外发布的镜像由 release.yml 的 packages job
      # 独占产出，两边都推会重复构建多架构镜像，还会多出一个 :main tag。
      release_gate:
        required: false
        default: false
        type: boolean

env:
  # 1.22 已停止安全维护，govulncheck 会报出大量永不修补的标准库漏洞。
  # 必须用 1.25.x：实测漏洞清单里标准库的最高修复要求是 go1.25.13
  # （crypto/tls、net/url、encoding/asn1 等），1.23/1.24 都不足以清零。
  # 升级工具链是让扫描恢复绿灯的正当手段，而非降低扫描门槛。
  GO_VERSION: "1.25"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l . | grep -v '^vendor/' || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化:"; echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # 先断言入口源码确实在仓库里。
      # 曾经踩过：.gitignore 里未锚定的 `gateway` / `mockupstream`
      # 把 cmd/gateway、cmd/mockupstream 整个目录忽略掉，checkout 出来没有 cmd/，
      # go mod tidy 于是"正确地"删掉只被入口引用的 mysql 驱动，
      # 报错却只显示一段 go.mod diff，完全指不到真实原因。
      - name: 校验入口源码完整
        run: |
          missing=0
          for pkg in cmd/gateway cmd/mockupstream; do
            if ! ls "${pkg}"/*.go >/dev/null 2>&1; then
              echo "::error::${pkg} 下无 Go 源码，可能被 .gitignore 误忽略（检查未锚定的产物名）"
              missing=1
            fi
          done
          [ "$missing" = "0" ]

      - name: go mod tidy 一致性
        run: |
          cp go.mod go.mod.bak && cp go.sum go.sum.bak
          go mod tidy
          diff go.mod go.mod.bak || { echo "::error::go.mod 未同步，请本地执行 go mod tidy"; exit 1; }
          diff go.sum go.sum.bak || { echo "::error::go.sum 未同步，请本地执行 go mod tidy"; exit 1; }

      # 版本需与 GO_VERSION 同步向上：golangci-lint 用自身编译时的 Go 做类型
      # 检查，旧版遇到更新的工具链会整体报加载错误，而非报出具体问题。
      # v1.64.8 已实测可在 Go 1.25 下编译并通过本仓库全部检查。
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

  unit-test:
    name: 单元测试（含 race 与真实 Redis）
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        # 注意：此处刻意不设 requirepass。若要加密码，
        # 必须同步设置下方的 REDIS_PASSWORD，否则测试会因 NOAUTH 而失败。
        # （REDIS_REQUIRED=1 会让这种失败立刻暴露，而不是静默跳过。）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # race 检测是必须的：限流器的并发正确性无法靠人工 review 保证
      #
      # REDIS_REQUIRED=1 是关键：限流内核测试依赖真实 Redis，
      # 若连不上就静默 Skip，CI 会在「核心逻辑一行未执行」的情况下报绿。
      # 这个坑真实发生过 —— compose 的 Redis 带密码而测试不带，
      # 11 个测试全部跳过，覆盖率停在 36.6% 却仍然 PASS。
      - name: 运行测试
        env:
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_REQUIRED: "1"
        run: |
          go test -race -count=1 -covermode=atomic \
            -coverprofile=coverage.out ./...

      # 断言核心测试确实执行过，而非被跳过
      - name: 校验限流内核未被跳过
        env:
          REDIS_ADDR: 127.0.0.1:6379
          REDIS_REQUIRED: "1"
        run: |
          out=$(go test ./internal/limiter/... -count=1 -v 2>&1)
          skipped=$(printf '%s' "$out" | grep -c '^--- SKIP' || true)
          passed=$(printf '%s' "$out" | grep -c '^--- PASS' || true)
          echo "限流内核: PASS=${passed} SKIP=${skipped}"
          if [ "$skipped" -gt 0 ]; then
            printf '%s\n' "$out" | grep '^--- SKIP' -A2
            echo "::error::限流内核存在被跳过的测试，核心逻辑未获验证"
            exit 1
          fi
          if [ "$passed" -lt 10 ]; then
            echo "::error::限流内核通过数 ${passed} 异常偏低，测试可能未真正运行"
            exit 1
          fi

      - name: 覆盖率摘要
        run: |
          go tool cover -func=coverage.out | tail -30
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "总覆盖率: ${total}%"
          echo "### 测试覆盖率: ${total}%" >> "$GITHUB_STEP_SUMMARY"

          # 限流内核是本项目的正确性核心，覆盖率不得退化
          lim=$(go tool cover -func=coverage.out \
            | grep 'internal/limiter' \
            | awk '{gsub("%","",$NF); s+=$NF; n++} END {if(n>0) printf "%.1f", s/n; else print "0"}')
          echo "限流内核平均覆盖率: ${lim}%"
          echo "### 限流内核覆盖率: ${lim}%" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 依赖与标准库的已知漏洞扫描。
      # 固定版本而非 @latest：govulncheck 新版会抬高 go directive 要求，
      # 用 @latest 可能在某次上游发版后突然装不上。
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      # 版本需与 GO_VERSION 同步向上：gosec 依赖自身编译时的 Go 做类型检查。
      # 实测 v2.21.4 在 Go 1.25 下连编译都过不去（其 x/tools@v0.25.0 报
      # "invalid array length -delta * delta"），必须用足够新的 v2.22.x。
      - name: gosec
        uses: securego/gosec@v2.22.11
        with:
          args: -exclude-dir=test -severity=medium ./...

  build-image:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 门禁模式下不登录：这一步只为验证镜像可构建，无需写权限。
      # inputs.release_gate 在非 workflow_call 触发时求值为空串（假），
      # 所以独立 CI 的行为不变。
      - name: 登录 GHCR
        if: ${{ github.event_name != 'pull_request' && !inputs.release_gate }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # 门禁模式与 PR 一样只构建不推送。
          # 注意 load 不能在多架构下开启（buildx 无法把多平台清单载入
          # 本地 docker），因此门禁模式两者都为 false —— 构建成功本身
          # 就是要验证的结论。
          push: ${{ github.event_name != 'pull_request' && !inputs.release_gate }}
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: 端到端验收
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    steps:
      - uses: actions/checkout@v4

      # compose 依赖 .env 提供端口与凭证。缺失时变量会退化为默认值，
      # 容易与 e2e 脚本的预期不一致，因此显式生成。
      #
      # 令牌必须运行时随机生成，不能在本文件里写死。原因有两条，
      # 都是实测踩过的：
      #  1. 硬编码值曾写作 ci-admin-token-for-e2e-32chars —— 名字自称 32
      #     实际只有 30 字符，网关按 MinTokenLen=32 直接 fatal 退出，
      #     健康检查轮询 60s 全部失败。字面量长度靠肉眼数是不可靠的。
      #  2. 即使补足到 32 字符也起不来：该值含子串 admin-token，
      #     命中 internal/admin/token.go 的 weakContains 黑名单。
      #     任何写在仓库里的固定令牌都是「公开可知」的，与本项目
      #     拒绝占位凭证的设计直接冲突。
      #
      # 用 hex 而非 base64：base64 会产出 / 与 + ，前者破坏 sed 替换语法。
      # hex 字母表为 [0-9a-f]，不可能命中任何黑名单标记（那些标记都含
      # hex 之外的字母），也不可能触发单字符重复检查。
      # rand -hex 24 → 48 字符，稳超 32 下限。
      - name: 准备环境变量
        run: |
          cp .env.example .env
          token="$(openssl rand -hex 24)"
          echo "::add-mask::${token}"
          sed -i "s|^ADMIN_TOKEN=.*|ADMIN_TOKEN=${token}|" .env
          echo "ADMIN_TOKEN=${token}" >> "$GITHUB_ENV"
          # 只断言长度，不回显令牌本身
          printf 'ADMIN_TOKEN 长度 %d 字符\n' "${#token}"
          [ "${#token}" -ge 32 ] || { echo "生成的令牌长度不足"; exit 1; }
          grep -E '^(PROXY_PORT|OBS_PORT|ADMIN_PORT)=' .env

      - name: 启动完整栈
        run: |
          docker compose up -d --build
          echo "等待网关就绪..."
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:29091/ready >/dev/null 2>&1; then
              echo "网关就绪（耗时 ${i}s）"; break
            fi
            # 崩溃重启循环要立刻失败，不能干等 60s。
            # compose 的 restart 策略会不断拉起 fatal 退出的进程，
            # up -d 本身返回 0，只靠轮询超时会白等一分钟且日志被刷屏，
            # 真正的 fatal 行淹没在反复的启动日志里。
            # 注意：单服务 logs 不带 "unirate-gateway |" 前缀，
            # 只能直接匹配 fatal: 本身。
            if docker compose logs gateway 2>/dev/null | grep -q 'fatal:'; then
              echo "网关启动即 fatal，终止等待："
              docker compose logs gateway 2>/dev/null | grep 'fatal:' | tail -3
              exit 1
            fi
            if [ "$i" = "60" ]; then
              echo "网关启动超时"; docker compose logs --tail=200; exit 1
            fi
            sleep 1
          done

      # ADMIN_TOKEN 由「准备环境变量」写入 GITHUB_ENV，本 step 自动继承，
      # 无需重复声明 —— 重复声明正是上一版两处字面量不同步的隐患来源。
      - name: 执行验收脚本
        run: |
          chmod +x test/e2e/run.sh
          ./test/e2e/run.sh

      - name: 失败时导出日志
        if: failure()
        run: docker compose logs --tail=400

      - name: 清理
        if: always()
        run: docker compose down -v
