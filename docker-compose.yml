# unirate 频控网关 —— 一键可跑编排
#
# 安全设计要点：
#   1. Admin 端口（9090）只绑定 127.0.0.1 且限制来源 CIDR，绝不对外暴露（评审 P0-3）；
#   2. Redis 强制密码且不映射到宿主，仅容器网络内可达；配置 SoT 是网关
#      进程内嵌的 SQLite，存放在命名卷 sqlite-data 中，无任何网络监听面；
#   3. 网关以非 root 运行，只读根文件系统 + 丢弃全部 capabilities；
#   4. 全部凭证用 ${VAR:?...} 声明为必填，**没有任何默认值**。
#
# 关于第 4 条 —— 这是对一个实测确认过的真实缺陷的修复：
# 本文件曾给 ADMIN_TOKEN 配默认值 change-me-admin-token-32chars-min，
# 用它可直接访问管理面（实测 HTTP 200）。该值公开写在仓库里，等于管理面无鉴权。
# 占位默认值比"没有默认值"危险得多：它看起来像已经配好了，没人会去复查。
# 降低部署门槛的正确做法是 `make init` 一键生成强随机凭证，而不是给默认值。
#
# 启动（本地构建，默认）： make init && docker compose up -d --build
# 启动（拉 GHCR 预构建镜像）：在 .env 设两项后 docker compose pull && docker compose up -d
#   GATEWAY_IMAGE=ghcr.io/jushenzhidao/unirate:0.1.4
#   GATEWAY_PULL_POLICY=always
#   注意此模式下不要带 --build，否则仍会本地构建并覆盖同名 tag。
# 验收： ./test/e2e/run.sh
#
# 为什么保留 build 段而不是直接把 image 换成 GHCR 地址：
# ci.yml 的「启动完整栈」与 Makefile 的 up/build 目标都跑 `--build`，
# 删掉 build 段这两条链会立刻报错。默认 GATEWAY_PULL_POLICY=build
# 使行为与改动前完全一致；要用发布镜像只改 .env 两行，不动本文件。
#
# GHCR 语义化 tag 不带 v 前缀（release.yml 用的是去掉 v 的 semver 输出），
# 写成 :v0.1.4 会 404。
#
# 监控方案：Logfire 云端监控，otel-collector 旁路抓取指标并转发。
# 关键告警需在 Logfire 侧配置（见 otel-collector 服务注释）。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.2-alpine
    container_name: unirate-redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置。请先执行 make init 生成含强随机凭证的 .env}
      - --maxmemory
      - 512mb
      # 计数器不可被随意淘汰：allkeys-lru 会让限流器"丢失记忆"从而放行超额流量。
      # 用 volatile-lru 只淘汰有 TTL 的键，且所有限流键都带 TTL。
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "no"
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD 未设置。请先执行 make init 生成含强随机凭证的 .env}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [unirate]
    logging: *default-logging
    restart: unless-stopped

  # MySQL 已移除。配置 SoT 改为网关进程内嵌的 SQLite（internal/store），
  # 数据落在下方 sqlite-data 卷。默认编排从 3 个容器降到 2 个。
  #
  # 取舍：SQLite 是单写者，因此不能横向扩多个「写实例」——
  # Admin 写入必须只有一个副本承担。这对本系统成立：配置写入是低频人工操作，
  # 而限流判定完全走 Redis，与 SQLite 无关，因此代理面依然可以任意水平扩展。
  # 若将来确实需要多副本同时写配置，那时才需要退回外置 RDBMS。

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    # 文件头注释描述的「拉 GHCR 预构建镜像」用法依赖这一行：
    # GATEWAY_IMAGE 此前只被 mock-upstream 引用，gateway 自身没有 image 字段，
    # 因此把 mock 移出主编排后必须在此声明，否则该变量无人读取、用法失效。
    image: ${GATEWAY_IMAGE:-unirate/gateway:${VERSION:-dev}}
    pull_policy: ${GATEWAY_PULL_POLICY:-build}
    container_name: unirate-gateway
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PROXY_ADDR: ":8080"
      OBS_ADDR: ":9091"
      # Admin 绑 0.0.0.0 是为了让 e2e 从宿主经映射端口访问；
      # 生产环境应保持默认 127.0.0.1 或仅在内网 overlay 暴露。
      ADMIN_ADDR: ":9090"
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN 未设置。请先执行 make init 生成含强随机凭证的 .env（网关会拒绝弱令牌与仓库占位值启动）}
      ADMIN_ALLOW_CIDRS: ${ADMIN_ALLOW_CIDRS:-172.16.0.0/12,10.0.0.0/8,127.0.0.0/8,192.168.0.0/16}

      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置。请先执行 make init 生成含强随机凭证的 .env}
      REDIS_POOL_SIZE: "256"
      REDIS_TIMEOUT: 200ms

      # 配置 SoT：SQLite 单文件，落在 sqlite-data 卷。
      # 容器 read_only: true，所以必须挂可写卷 —— 否则建表即失败。
      STORE_DSN: /var/lib/unirate/unirate.db

      # 东八区：1d/1w 窗口按北京时间零点对齐
      TZ_OFFSET_SECONDS: "28800"
      TZ: Asia/Shanghai
      # 集群实例数，用于 Redis 故障时的本地保守配额估算
      INSTANCES: "1"

      # compose 内网关直接对外，不存在可信代理 → 不信任 XFF（防伪造）
      TRUSTED_PROXY_HOPS: "0"
      # 请求头指定上游默认关闭（SSRF 防护）
      ALLOW_HEADER_UPSTREAM: "false"
      # SSRF 白名单，与上一行是同一道防线的两半。
      # 留空 = 不限制上游主机（仅在 ALLOW_HEADER_UPSTREAM=false 时才安全）。
      # 一旦把上面那行改成 true，这里必须同时填写允许的上游主机，
      # 否则请求方可让网关访问任意内网地址（含云元数据 169.254.169.254）。
      UPSTREAM_ALLOWLIST: ${UPSTREAM_ALLOWLIST:-}

      UPSTREAM_TIMEOUT: 60s
      TOKEN_FLUSH_INTERVAL: 1s
      CONFIG_POLL_INTERVAL: 15s
      SHUTDOWN_GRACE: 30s
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VERSION: ${VERSION:-dev}
    ports:
      - "${PROXY_PORT:-28080}:8080"
      - "${OBS_PORT:-29091}:9091"
      # Admin 只绑宿主回环，外部网络无法直达
      - "127.0.0.1:${ADMIN_PORT:-29090}:9090"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # SQLite 数据目录。WAL 模式会额外产生 -wal 与 -shm 两个文件，
      # 因此必须挂**目录**而非单个文件——挂文件会导致 WAL 无法创建。
      - sqlite-data:/var/lib/unirate
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/live"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks: [unirate]
    logging: *default-logging
    restart: unless-stopped

  # Logfire 接入：Collector 旁路抓取 gateway:9091/metrics 转发到 Logfire。
  # Go 代码零改动 —— /metrics 已是标准 Prometheus text exposition v0.0.4。
  #
  # 已从 deploy/prometheus/rules.yml 迁移的关键告警（必须在 Logfire 侧配置）：
  # 1. RateLimiterDegraded (unirate_redis_breaker_open > 0, for 1m) - CRITICAL
  #    限流静默失效没有任何用户可见症状，这是最重要的告警。
  # 2. DegradedDecisionRate (sum(rate(unirate_degraded_decisions_total[5m])) > 1, for 2m)
  # 3. HighRejectRate (reject / total > 0.3, for 5m)
  # 4. RedisErrorsElevated (sum(rate(unirate_redis_errors_total[5m])) > 5, for 2m)
  # 5. ConcurrencyLeakSuspected (min_over_time(unirate_concurrency_in_flight[15m]) > 10 且无流量, for 10m) - CRITICAL
  # 6. ConfigStale (unirate_config_version == 0, for 5m) - CRITICAL
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTEL_COLLECTOR_VERSION:-0.115.1}
    container_name: unirate-otel-collector
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    environment:
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:?LOGFIRE_TOKEN 未设置。请在 .env 中配置 Logfire write token}
      # 美区 logfire-us / 欧区 logfire-eu，按账号所属区域选择
      LOGFIRE_ENDPOINT: ${LOGFIRE_ENDPOINT:-https://logfire-us.pydantic.dev}
      # 指标降频的唯一正确手段：拉长抓取间隔。
      # 不要对指标做概率采样——会破坏 counter 单调性，令 rate() 出现负值。
      OTEL_SCRAPE_INTERVAL: ${OTEL_SCRAPE_INTERVAL:-15s}
      OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-warn}
      OTEL_DEBUG_VERBOSITY: ${OTEL_DEBUG_VERBOSITY:-basic}
      DEPLOY_ENV: ${DEPLOY_ENV:-dev}
    depends_on: [gateway]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [unirate]
    logging: *default-logging
    restart: unless-stopped

networks:
  unirate:
    driver: bridge

volumes:
  # SQLite 配置 SoT（替代原 mysql-data）
  sqlite-data:
